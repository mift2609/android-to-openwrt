# DHCP untuk klien WiFi (wlan0 / 192.168.43.0/24).
#
# Kenapa di sini dan bukan di /etc/config/dhcp: interface 'wifi' TIDAK dikelola netifd
# (IP wlan0 dipasang skrip rolex-wifi), sehingga dnsmasq tak pernah membuat dhcp-range
# untuknya -> klien WiFi asosiasi tapi tidak mendapat IP. Berkas ini dipakai lewat
# `option confdir '/etc/dnsmasq.d'` pada seksi dnsmasq.
dhcp-range=set:wifi,192.168.43.100,192.168.43.249,255.255.255.0,12h
dhcp-option=tag:wifi,option:router,192.168.43.1
dhcp-option=tag:wifi,option:dns-server,192.168.43.1
