# Profil perangkat: Samsung Galaxy Z Flip3 5G (b2q / SM-F711B) — SM8350 (Snapdragon 888)
#
# STATUS (2026-11-13): BELUM PERNAH BOOT MAINLINE. Tidak ada port yang jalan di mana pun
# untuk perangkat ini (wiki pmOS `samsung-b2q` = "not booting, not started"). Yang ada di
# sini adalah profil + DTS rintisan supaya CI bisa membangun dan mengujinya secara
# bertahap. ATURAN YANG DIPEGANG: jangan menulis partisi apa pun sebelum kernel mainline
# ini terbukti boot (lihat devices/b2q/README.md).
#
# Yang WAJIB diukur di perangkat dan masih TODO di bawah: argumen mkbootimg, nama partisi,
# dan entri uniLoader (TEXT_BASE/PAYLOAD_ENTRY/RAMDISK_ENTRY). Jalankan
# scripts/devices/probe-device.sh begitu HP tersambung hidup (X-ROM sudah ber-root via
# KernelSU, jadi tidak perlu flash apa pun untuk mengukur).

DEVICE_NAME="Samsung Galaxy Z Flip3 5G (b2q)"
SOC="sm8350"                    # Snapdragon 888. TIDAK ada fork mainline keluarga ini yang
                                # dipakai komunitas: dukungan sm8350 ada langsung di upstream
                                # (sm8350.dtsi, PINCTRL_SM8350, SM_GCC_8350, SCSI_UFS_QCOM).
ARCH="arm64"
CROSS_COMPILE="aarch64-linux-gnu-"

# --- jalur B: kernel ---------------------------------------------------------
KERNEL_REPO="https://github.com/torvalds/linux"
KERNEL_TAG="v7.3"
KERNEL_CONFIG_FRAGMENT="devices/b2q/kernel.config.fragment"
# Config DASAR: `defconfig` upstream (tidak ada defconfig keluarga sm8350 di fork mana pun).
# defconfig upstream sudah memuat ARCH_QCOM + pinctrl sm8350 + UFS + DWC3; fragment perangkat
# menambah yang khusus router headless.
KERNEL_BASE_DEFCONFIG="defconfig"
DTB="qcom/sm8350-samsung-b2q.dtb"          # TIDAK ada di upstream -> disalin dari profil ini
DEVICE_DTS_SRC="devices/b2q/dts/sm8350-samsung-b2q.dts"   # dipakai scripts/build/apply-device-dts.sh

# --- bootloader: uniLoader, BUKAN lk2nd --------------------------------------
# lk2nd tidak punya dukungan SM8350/SM8450 sama sekali (device/dts hanya sampai MSM8996).
# Dan Samsung tidak bisa boot mainline langsung: ABL Samsung menempelkan fragment DT
# overlay-nya sendiri ke DTB mana pun yang ia pilih -> DT mainline rusak, kernel mati
# sebelum ada console (kegagalan senyap, terbukti di S22 r0q dan Tab S8+ SM8450).
# Solusinya sama seperti port-port Samsung Qualcomm lain: uniLoader sebagai loader kedua,
# yang membawa Image+DTB+ramdisk di dalam dirinya sehingga ABL hanya melihat "kernel".
LOADER="uniloader"
LOADER_REPO="https://github.com/ivoszbg/uniLoader"
LOADER_SOC="SM8350"                 # uniLoader SUDAH punya SoC ini (board Motorola Edge 30 Fusion)
LOADER_BOARD="SAMSUNG_B2Q"          # board baru -> devices/b2q/uniloader/
LOADER_CONFIG="devices/b2q/uniloader/b2q_defconfig"
LK2ND_REQUIRED=0
LK2ND_REPO=""

# --- boot image (HIPOTESIS — belum diukur dari boot image b2q) ----------------
# Sumber angka: deviceinfo port Halium/Ubuntu Touch samsung-b2q (pasnov-oleksandr/samsung-b2q)
# yang memang membaca boot image perangkat ini: base 0x0, kernel_offset 0x8000,
# ramdisk_offset 0x01000000, header_version 3 (dtbo terpisah, qcdt false).
# pagesize 2048 = default Android; BELUM dibuktikan untuk b2q.
# PENTING: port S22 (SM8450) memakai boot image v4 saat menaruh uniLoader di slot kernel.
# Jangan menganggap v3 benar hanya karena itu nilai stok — uji keduanya.
MKBOOTIMG_ARGS="--header_version 3 --pagesize 0x00000800 --base 0x00000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 --board ''"
KERNEL_CMDLINE="console=tty0 console=ttyMSM0,115200n8 earlycon panic=5 loglevel=7"
# Cmdline stok b2q (rujukan, dari deviceinfo Halium yang sama):
#   androidboot.hardware=qcom androidboot.memcg=1 lpm_levels.sleep_disabled=1
#   msm_rtb.filter=0x237 service_locator.enable=1 androidboot.usbcontroller=a600000.dwc3
#   swiotlb=2048 loop.max_part=7 firmware_class.path=/vendor/firmware_mnt/image
#   printk.devkmsg=on pcie_ports=compat cpuinfo.chipname=SM8350 panic=4
# Catatan: uniLoader memaksa cmdline-nya sendiri -> kalau pakai uniLoader, baris di atas
# hanya untuk uji kernel langsung (jalur yang kemungkinan besar mati senyap).

# --- partisi (TODO: konfirmasi lewat `ls -l /dev/block/by-name/` di HP) ------
BOOT_PARTITION="/dev/block/by-name/boot"
RECOVERY_PARTITION="/dev/block/by-name/recovery"
USERDATA_PARTITION="/dev/block/by-name/userdata"

# --- jaringan ----------------------------------------------------------------
# Subnet 44, bukan 42: mido/rolex memakai 42, dan dua perangkat yang tersambung
# bersamaan dengan subnet identik membuat routing host ambigu.
GADGET_IP="192.168.44.1/24"
HOST_IP="192.168.44.2/24"
HOST_MAC="02:1a:11:00:44:01"
DEVICE_MAC="02:1a:11:00:44:02"
AP_SSID="b2q-hotspot"
AP_PASSPHRASE=""

# --- jalur A (chroot, NOL FLASH) --------------------------------------------
# Ini jalur pembuktian "OpenWrt bisa boot" tanpa menyentuh partisi.
CHROOT_DIR="/data/local/openwrt"
OPENWRT_RELEASE="24.10.5"
OPENWRT_ROOTFS_ARCH="arm64"
