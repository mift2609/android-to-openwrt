# Profil perangkat: Xiaomi Redmi 4A (rolex) — MSM8917 / Snapdragon 425
# Dibuat dengan scripts/devices/new-device.sh (verifikasi repo+tag+DTB lewat GitHub API),
# lalu dilengkapi keterangan perangkat. Format: sh (bisa di-source).
#
# STATUS: profil ini BELUM diuji di perangkat oleh penulis repo. Jangan menyalin
# MKBOOTIMG_ARGS dari perangkat lain — untuk rolex nilainya masih TODO dan harus diukur.

DEVICE_NAME="Xiaomi Redmi 4A (rolex)"
SOC="msm8917"                    # keluarga msm89x7 (MSM8917/8920/8937/8940, SDM429/439, QM215)
ARCH="arm64"
CROSS_COMPILE="aarch64-linux-gnu-"

# --- jalur B: kernel (terverifikasi) -----------------------------------------
# Fork mainline untuk keluarga msm89x7 (turunan msm8916-mainline). Default branch repo
# adalah branch rilis (msm89x7/7.1.3); tag rilis tersedia sebagai v<kernel>-r<n>.
KERNEL_REPO="https://github.com/msm89x7-mainline/linux"
KERNEL_TAG="v7.1.3-r1"           # tag terverifikasi ada; pmOS di perangkat ini memakai 6.15
# uname -r = "<versi kernel>-MagicBox". Dipakai agar cocok dengan build pembanding yang
# sudah terbukti di perangkat ini (OpenWrt 23.05.5 r24106 + kernel 6.13.6-MagicBox).
KERNEL_LOCALVERSION="-MagicBox"
KERNEL_CONFIG_FRAGMENT="devices/rolex/kernel.config.fragment"
# Config DASAR: config keluarga SoC dari fork, BUKAN `defconfig` upstream.
# `make defconfig` tidak menyalakan pinctrl/MMC_SDHCI_MSM/regulator RPM SMD/GCC clock ->
# eMMC tidak probe (terbukti: /dev/mmcblk* kosong di probe initramfs, devices_deferred
# memuat i2c menunggu pinctrl@1000000). `msm8916_defconfig` di fork msm89x7 memuat
# CONFIG_PINCTRL_MSM8916, CONFIG_MMC_SDHCI_MSM, CONFIG_REGULATOR_QCOM_SMD_RPM,
# CONFIG_QCOM_CLK_SMD_RPM, CONFIG_USB_CHIPIDEA, CONFIG_CONFIGFS_FS.
KERNEL_BASE_DEFCONFIG="msm8916_defconfig"
DTB="qcom/msm8917-xiaomi-rolex.dtb"   # terverifikasi: terdaftar di dts/qcom/Makefile

# bootloader: lk2nd WAJIB di perangkat ini (bukan opsional). Tanpa lk2nd, kernel mainline
# tidak memilih panel yang benar -> layar hitam walau kernel hidup.
# Diverifikasi lewat GitHub API 2026-11-12:
#   * msm89x7-mainline/lk2nd  -> TIDAK punya entri rolex. Default branch-nya `r4x/rebase_ro`
#     (master juga) hanya memuat msm8940-xiaomi-santoni.dts + rules.mk + xiaomi.dtsi di dts/msm8952.
#   * msm8916-mainline/lk2nd (branch main) -> ADA, di
#     lk2nd/device/dts/msm8952/msm8917-xiaomi-common.dts:
#       rolex { model = "Xiaomi Redmi 4A (rolex)"; compatible = "xiaomi,rolex";
#               lk2nd,dtb-files = "msm8917-xiaomi-rolex";
#               lk2nd,match-cmdline = "*board_id=S88503*"; }
#     -> lk2nd untuk rolex diambil dari msm8916-mainline/lk2nd, BUKAN dari repo msm89x7.
LK2ND_REPO="https://github.com/msm8916-mainline/lk2nd"
LK2ND_REQUIRED=1
# Artefak siap pakai: rilis 23.1, aset lk2nd-msm8952.img (target lk2nd untuk keluarga msm8952/8917)
#   https://github.com/msm8916-mainline/lk2nd/releases/download/23.1/lk2nd-msm8952.img
#   sha256 938d35fa5b2a6702af56b5082d19be2e3196bfec1a17bbc598b75614a9f63b05
#   (diperiksa terhadap sha256sums.txt rilis itu: cocok)
LK2ND_IMG="lk2nd-msm8952.img"

# --- diukur dari boot image yang benar-benar dipakai perangkat ini (2026-11-12) ----
# Sumber: dump partisi boot (p21, mmcblk0p21, 64 MiB) dari perangkat, dibongkar dengan
# scripts/tools/unpack_bootimg.py. Argumen di bawah adalah yang diterima aboot rolex.
MKBOOTIMG_ARGS="--header_version 0 --os_version 10.0.0 --os_patch_level 2022-03 --pagesize 0x00000800 --base 0x00000000 --kernel_offset 0x80008000 --ramdisk_offset 0x81000000 --second_offset 0x80f00000 --tags_offset 0x80000100 --board ''"
# Command line untuk OpenWrt (BUKAN cmdline Android di dump stok). Cmdline stok yang terukur,
# sebagai rujukan kalau perlu kembali:
#   androidboot.hardware=qcom msm_rtb.filter=0x237 ehci-hcd.park=3 lpm_levels.sleep_disabled=1
#   androidboot.bootdevice=7824900.sdhci earlycon=msm_hsl_uart,0x78B0000 loop.max_part=7
#   buildvariant=userdebug
KERNEL_CMDLINE="console=tty0 console=ttyMSM0,115200n8 earlycon panic=5 loglevel=7"

# partisi (terukur di perangkat ini 2026-11-12; pakai nama, bukan nomor)
#   p21 boot 64 MiB | p22 recovery 64 MiB | p49 userdata 25020 MiB (~24,4 GiB)
BOOT_PARTITION="/dev/block/bootdevice/by-name/boot"
USERDATA_PARTITION="/dev/block/bootdevice/by-name/userdata"
# lk2nd menaruh dirinya di offset 0 partisi boot dan menulis boot image di 512 KiB
# (dinyatakan lk2nd sendiri: "fastboot flash boot boot.img will flash the actual boot image
#  with 512 KiB offset into the boot partition" -> Documentation lk2nd README).
LK2ND_OFFSET_KIB=512

# --- jaringan ----------------------------------------------------------------
GADGET_IP="192.168.42.1/24"
HOST_IP="192.168.42.2/24"
HOST_MAC="02:1a:11:00:42:01"
DEVICE_MAC="02:1a:11:00:42:02"
AP_SSID="rolex-hotspot"
AP_PASSPHRASE=""

# --- jalur A (chroot) --------------------------------------------------------
CHROOT_DIR="/data/local/openwrt"
OPENWRT_RELEASE="24.10.5"
OPENWRT_ROOTFS_ARCH="arm64"
