# AdGuard Home untuk rolex — konfigurasi awal (bisa diubah lewat UI http://<ip-rolex>:3000)
#
# Alur DNS di rolex:
#   klien LAN  -> AdGuard Home :53  (saring iklan/malware, DoH/DoT opsional)
#                  -> upstream 127.0.0.1:5353 = dnsmasq  (nama lokal .lan, DHCP, DNS operator)
#   dnsmasq tetap melayani DHCP + nama lokal, tapi pindah port ke 5353.
http:
  address: 0.0.0.0:3000
  session_ttl: 720h
users:
  - name: admin
    password: $2b$10$qVD.tMz7wgjmm9PhFIS.vONbyHnZKkQ5KEZXmrdzS4NdmuvDMZz5m   # sandi: rolex (GANTI lewat UI)
auth_attempts: 5
block_auth_min: 15
http_proxy: ""
language: id
theme: auto
dns:
  # AdGuard TIDAK memegang port 53 lagi. Klien menanyakan dnsmasq (192.168.*.1:53),
  # dnsmasq meneruskan ke sini (127.0.0.1:5353) untuk penyaringan iklan, lalu AGH
  # meneruskan ke DNS publik. Sebelumnya AGH di :53 membuat klien WiFi "tak ada internet".
  bind_hosts:
    - 127.0.0.1
  port: 5353
  anonymize_client_ip: false
  ratelimit: 20
  ratelimit_subnet_len_ipv4: 24
  ratelimit_subnet_len_ipv6: 56
  ratelimit_whitelist: []
  refuse_any: true
  upstream_dns:
    - 8.8.8.8
    - 8.8.4.4
    - 1.1.1.1
  upstream_dns_file: ""
  bootstrap_dns:
    - 9.9.9.10
    - 149.112.112.10
  fallback_dns: []
  upstream_mode: load_balance
  fastest_timeout: 1s
  allowed_clients: []
  disallowed_clients: []
  blocked_hosts: []
  trusted_proxies:
    - 127.0.0.0/8
    - 192.168.26.0/24
    - 192.168.27.0/24
  cache_size: 4194304
  cache_ttl_min: 0
  cache_ttl_max: 0
  cache_optimistic: true
  bogus_nxdomain: []
  aaaa_disabled: false
  enable_dnssec: false
  max_goroutines: 300
  handle_ddr: true
  ipset: []
  filtering_enabled: true
  filters_update_interval: 24
  parental_enabled: false
  safesearch: {}
  safe_fs_patterns: []
  blocked_response_ttl: 10
  querylog_enabled: true
  querylog_file_enabled: true
  querylog_interval: 2160h
  querylog_size_memory: 1000
  anonymize_client_ip_setting: false
  statistics_enabled: true
  statistics_interval: 360
  use_private_ptr_resolvers: true
  local_ptr_upstreams: []
  use_dns64: false
  dns64_prefixes: []
  serve_http3: false
  use_http3_upstreams: false
  serve_plain_dns: true
filters:
  - enabled: true
    url: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
    name: AdGuard DNS filter
    id: 1
  - enabled: true
    url: https://raw.githubusercontent.com/AdguardTeam/HostlistsRegistry/main/assets/hostlist/indonesia.txt
    name: Indonesia (AdGuard hostlist)
    id: 2
whitelist_filters: []
user_rules: []
dhcp:
  enabled: false
  interface_name: ""
  local_domain_name: lan
  dhcpv4:
    gateway_ip: ""
    subnet_mask: ""
    range_start: ""
    range_end: ""
    lease_duration: 86400
    icmp_timeout_msec: 1000
    options: []
  dhcpv6:
    range_start: ""
    lease_duration: 86400
    ra_slaac_only: false
    ra_allow_slaac: false
clients:
  runtime_sources:
    whois: true
    arp: true
    rdns: true
    dhcp: true
    hosts: true
  persistent: []
log:
  file: /opt/AdGuardHome/AdGuardHome.log
  max_backups: 0
  max_size: 100
  max_age: 3
  compress: false
  local_time: true
  verbose: false
os:
  group: ""
  user: ""
  rlimit_nofile: 0
schema_version: 29
