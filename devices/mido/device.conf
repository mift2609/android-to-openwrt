# Profil perangkat: Xiaomi Redmi Note 4X (mido) — MSM8953
# Sumber kebenaran tunggal untuk skrip build/flash. Format: sh (bisa di-source).
# Jalur A (chroot di atas Android) + jalur B (mainline bare-metal).

DEVICE_NAME="Xiaomi Redmi Note 4X (mido)"
SOC="msm8953"
ARCH="arm64"
CROSS_COMPILE="aarch64-linux-gnu-"

# --- jalur B: kernel ---------------------------------------------------------
KERNEL_REPO="https://github.com/msm8953-mainline/linux"
# Tag yang TERBUKTI dipakai user (OpenWrt 24.10.5 + kernel 6.19.5). Tag lebih baru
# ada (mis. v7.1.3-r0) tapi belum diuji di perangkat ini.
KERNEL_TAG="v6.19.5-r0"
KERNEL_CONFIG_FRAGMENT="devices/mido/kernel.config.fragment"
DTB="qcom/msm8953-xiaomi-mido.dtb"

# Argumen mkbootimg WAJIB identik dengan boot image yang sudah terbukti boot.
# Satu argumen beda = bootloader tidak mengenali image-nya.
MKBOOTIMG_ARGS="--base 0x80000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 --pagesize 2048 --header_version 0"
KERNEL_CMDLINE="console=tty0 console=ttyMSM0,115200n8 earlycon panic=5 loglevel=7"

# --- partisi (jangan menebak; lihat docs/04) ---------------------------------
# p21=boot (64 MB, lk2nd + kernel), p22=recovery, p49=userdata (rootfs OpenWrt)
BOOT_PARTITION="/dev/block/bootdevice/by-name/boot"
USERDATA_PARTITION="/dev/block/bootdevice/by-name/userdata"
# lk2nd hidup di 512 KiB pertama partisi boot -> image kernel ditulis di offset ini
LK2ND_OFFSET_KIB=512

# --- jaringan ----------------------------------------------------------------
GADGET_IP="192.168.42.1/24"      # IP perangkat; JANGAN 192.168.1.1 (bentrok router rumah)
HOST_IP="192.168.42.2/24"        # IP host yang menancap ke USB; tanpa default gateway
HOST_MAC="02:1a:11:00:42:01"
DEVICE_MAC="02:1a:11:00:42:02"
AP_SSID="mido-hotspot"
AP_PASSPHRASE=""                 # kosongkan untuk AP terbuka; isi utk WPA2

# --- jalur A (chroot) --------------------------------------------------------
CHROOT_DIR="/data/local/openwrt"
OPENWRT_RELEASE="24.10.5"
OPENWRT_ROOTFS_ARCH="arm64"      # armsr/armv8 (arm64 generik) di HP; x86_64 hanya untuk uji host
