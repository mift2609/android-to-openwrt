<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel OpenWrt — rolex</title>
<link rel="stylesheet" href="/s.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">O</div>
    <div class="brand-name">OpenWrt</div>
    <span class="badge">GO</span>
  </div>

  <nav class="nav" id="nav">
    <div class="navgroup" data-g="core">
      <button class="navbtn on">Core <i>▾</i></button>
      <div class="drop">
        <div class="drophead">TAB CORE <span class="count">3</span></div>
        <a href="#ringkasan" data-p="ringkasan">Ringkasan <span class="tag mint">OPEN</span></a>
        <a href="#sistem" data-p="sistem">Sistem <span class="tag ice">SYS</span></a>
        <a href="#tentang" data-p="tentang">Tentang <span class="tag">INFO</span></a>
      </div>
    </div>
    <div class="navgroup" data-g="network">
      <button class="navbtn">Network <i>▾</i></button>
      <div class="drop">
        <div class="drophead">TAB NETWORK <span class="count">2</span></div>
        <a href="#seluler" data-p="seluler">Seluler <span class="tag ice">CELL</span></a>
        <a href="#wifi" data-p="wifi">WiFi / AP <span class="tag mint">WIFI</span></a>
      </div>
    </div>
    <div class="navgroup" data-g="system">
      <button class="navbtn">System <i>▾</i></button>
      <div class="drop">
        <div class="drophead">TAB SYSTEM <span class="count">1</span></div>
        <a href="#layanan" data-p="layanan">Layanan <span class="tag peach">SVC</span></a>
      </div>
    </div>
    <div class="navgroup" data-g="tools">
      <button class="navbtn">Tools <i>▾</i></button>
      <div class="drop">
        <div class="drophead">TAUTAN <span class="count">4</span></div>
        <a href="/cgi-bin/luci/" target="_blank">LuCI <span class="tag">UI</span></a>
        <a href="http://192.168.42.1:7681" target="_blank">Terminal <span class="tag">PTY</span></a>
        <a href="http://192.168.42.1:8686" target="_blank">Bandix <span class="tag">NET</span></a>
        <a href="http://192.168.42.1:3000" target="_blank">AdGuard <span class="tag">DNS</span></a>
      </div>
    </div>
  </nav>

  <div class="chips" id="chips">
    <span class="chip"><span class="dot"></span>memuat…</span>
  </div>
  <div class="topactions">
    <button class="iconbtn" id="theme" title="Tema terang/gelap">◐</button>
    <a class="iconbtn" href="/cgi-bin/luci/" target="_blank" title="Buka LuCI">↗</a>
    <button class="iconbtn danger" id="logout" title="Keluar">⏻</button>
  </div>
</header>

<main class="content" id="view"><p class="loader">memuat data…</p></main>

<div class="footerbar">OpenWrt 24.10.5 &bull; rolex &bull; MSM8917 &bull; <span id="ver"></span></div>
<script src="/a.js"></script>
</body>
</html>
